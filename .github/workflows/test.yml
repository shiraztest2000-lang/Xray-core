name: Tests and Checkings

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Restore Geodat Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-${{ github.sha }}

      - name: Download and Verify Geodata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p resources
          declare -A files=(
            [geoip.dat]="geoip/geoip-lite"
            [geosite.dat]="geosite/geosite"
          )
          for file in "${!files[@]}"; do
            source="${files[$file]}"
            base="https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/${source}"
            expected="$(curl --fail --silent --show-error --location "${base}.dat.sha256sum" | awk '{print $1}')"
            test -n "$expected"
            curl --fail --silent --show-error --location "${base}.dat" -o "resources/$file"
            actual="$(sha256sum "resources/$file" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "SHA-256 verification failed for $file"
              exit 1
            fi
            test -s "resources/$file"
            echo "Verified $file ($actual)"
          done

      - name: Save Geodat Cache
        uses: actions/cache/save@v6
        with:
          path: resources
          key: xray-geodat-${{ github.sha }}

  check-format-and-proto:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - name: Check Format
        run: go run ./infra/vformat/main.go -mode check -pwd ./
      - name: Check Protobuf
        run: go run ./infra/vprotogen/main.go -mode check -pwd ./

  test:
    needs: check-assets
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Restore Verified Geodata Cache
        uses: actions/cache/restore@v6
        with:
          path: resources
          key: xray-geodat-${{ github.sha }}
          enableCrossOsArchive: true
      - name: Verify Geodata Cache
        shell: bash
        run: |
          test -s resources/geoip.dat
          test -s resources/geosite.dat
      - name: Test
        run: go test -timeout 1h -v ./...
